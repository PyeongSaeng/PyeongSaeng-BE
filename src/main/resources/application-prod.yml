spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: my-redis
      port: 6379

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

logging:
  level:
    org.hibernate.SQL: INFO
    com.your.package: INFO
    org.springframework.web: DEBUG
    org.springframework.boot.actuate: DEBUG

swagger:
  server-url: https://api.pyeongsaeng.site

server:
  port: 8080
  address: 0.0.0.0

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
    health:
      show-details: always
  metrics:
    enable:
      #processor: false
      system: false
    distribution:
      percentiles-histogram:
        http.server.requests: true
